name: Validate WordPress source

on:
  pull_request:
  push:
    branches:
      - main
      - wordpress-migration

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository policy and JSON
        shell: pwsh
        run: ./tools/validate.ps1

  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint custom PHP
        run: find wp-content tools -type f -name '*.php' -print0 | xargs -0 -n1 php -l
